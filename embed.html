<!-- START COUNTDOWN BANNER WIDGET -->
<div id="countdown-banner-wrap" style="width: 100%; height: 60px; transition: height 0.2s ease; overflow: hidden; background: #e3ebf3;">
    <iframe 
      src="https://YOUR_GITHUB_USERNAME.github.io/sale-widget/banner.html" 
      style="width: 100%; height: 100%; border: none; display: block;" 
      title="Sale Countdown Banner"
      sandbox="allow-scripts allow-same-origin">
    </iframe>
  </div>
  
  <script>
    // Dynamically responds to resize and close triggers sent by the iframe widget
    window.addEventListener('message', function(event) {
      if (!event.data || typeof event.data !== 'object') return;
      
      const container = document.getElementById('countdown-banner-wrap');
      if (!container) return;
  
      // Handle height scaling for mobile devices
      if (event.data.type === 'resize-sale-banner') {
        container.style.height = event.data.height + 'px';
      }
      
      // Handle dismissing the banner when the ✕ button is clicked
      if (event.data.type === 'hide-sale-banner') {
        container.style.height = '0px';
        setTimeout(() => container.remove(), 200);
      }
    });
  </script>
  <!-- END COUNTDOWN BANNER WIDGET -->
